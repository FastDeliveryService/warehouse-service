databaseChangeLog:
  - changeSet:
      id: create-stock-reservations
      author: tabletka97
      changes:
        - createTable:
            tableName: stock_reservations
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true

              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: darkstore_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_stock_reservation_darkstore
                    referencedTableName: darkstores
                    referencedColumnNames: id

              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false


        - createTable:
            tableName: stock_reservation_items
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true

              - column:
                  name: reservation_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_stock_reservation_item_reservation
                    referencedTableName: stock_reservations
                    referencedColumnNames: id

              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false

        - createIndex:
            tableName: stock_reservations
            indexName: idx_stock_reservations_order
            columns:
              - column:
                  name: order_id

        - createIndex:
            tableName: stock_reservation_items
            indexName: idx_stock_reservation_items_reservation
            columns:
              - column:
                  name: reservation_id

        - sql:
            sql: >
              CREATE UNIQUE INDEX idx_unique_active_reservation 
              ON stock_reservations (order_id) 
              WHERE status IN ('ACTIVE', 'CONFIRMED');
      rollback:
        - sql:
            sql: DROP INDEX idx_unique_active_reservation;