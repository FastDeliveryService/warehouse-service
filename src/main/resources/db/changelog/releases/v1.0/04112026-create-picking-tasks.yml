databaseChangeLog:
  - changeSet: 
      id: create-picking-tasks
      author: tabletka97
      changes:
        - createTable:
            tableName: picking_tasks
            columns:

              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true

              - column:
                  name: order_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: darkstore_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_picking_task_darkstore
                    referencedTableName: darkstores
                    referencedColumnNames: id

              - column:
                  name: reservation_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_picking_task_reservation
                    referencedTableName: stock_reservations
                    referencedColumnNames: id

              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false

        - createTable:
            tableName: picking_task_items
            columns:

              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true

              - column:
                  name: picking_task_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_picking_task_item_task
                    referencedTableName: picking_tasks
                    referencedColumnNames: id

              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false